ing=\"lazy\"></iframe></p>\n\n"},{"id":"g531f258fb3a7463123819bf52a55a587","kind":"page","title":"Flow Charts","nav_title":"Flow Charts","position":5,"published":true,"content_html":"<p><iframe src=\"https://docs.google.com/presentation/d/e/2PACX-1vS-7HBBDjWRoZrNsJVhiI6aMYxX1BnA4aeMcUyeugLn5svZFzrOYYbJYjQDg0qKssxdZOwnrcm1fZbp/embed?start=false&amp;loop=false&amp;delayms=3000\" width=\"960\" height=\"569\" allowfullscreen=\"allowfullscreen\" webkitallowfullscreen=\"webkitallowfullscreen\" mozallowfullscreen=\"mozallowfullscreen\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"g76a7b74488c2b9eacfb9b411606f38b7","kind":"page","title":"Patterns and Pattern Recognition","nav_title":"Patterns and Pattern Recognition","position":6,"published":true,"content_html":"<iframe src=\"https://docs.google.com/presentation/d/e/2PACX-1vQ6LQKnFaMMW2TGtBa4PAkWSAhmEDO2Q3li4FWln0_ig5EVpU13b9eRO3av9QzzRo0Y2R8eIwB54L63/embed?start=false&amp;loop=false&amp;delayms=3000\" frameborder=\"0\" width=\"960\" height=\"569\" allowfullscreen=\"true\" mozallowfullscreen=\"true\" webkitallowfullscreen=\"true\" loading=\"lazy\"></iframe>\n\n"}]},{"id":"gdcd327faba249ba761dbab487cb3232c","slug":"04-scratch-01-visual-programming-and-problem-solving","title":"Scratch 01:  Visual Programming and Problem-Solving","order":4,"items":[{"id":"g19b772f0930e01ce379854a4d39d0b98","kind":"file","title":"Scratch Environment and Problem Solving.pptx","nav_title":"Scratch Environment and Problem Solving.pptx","position":1,"published":true,"media_path":"media/web_resources/Scratch-Environment-and-Problem-Solving.pptx"},{"id":"gaf5e2a20b8a9e1de94bc40c4ca141a03","kind":"quiz","title":"Practice Quiz One:  Stage, Broadcasts, Sounds","nav_title":"Practice Quiz One:  Stage, Broadcasts, Sounds","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 6.0</span></div><p>This practice quiz is connected to our first few days of class, and will help prepare you for the first graded quiz!</p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of </span><span>4</span><span>8</span><span>0</span><span> and a stage height of </span><span>3</span><span>6</span><span>0</span><span>,</span><span> what is the current y-position of Scratch?</span></p>\n<p><span><img src=\"https://sps.blackboard.com/bbcswebdav/xid-1294534_1\" alt=\"\" width=\"324\" height=\"269\" loading=\"lazy\"></span></p>\n<p><img src=\"media/web_resources/W01-Q-04-.JPG\" alt=\"Stage Question\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 90</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 360</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -180</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of 480 and a stage height of 360, what is the current </span><strong>x-position</strong><span> of Scratch?</span></p>\n<p><img src=\"media/web_resources/assessment_questions/W01-Q-06.JPG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 480</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Question</h3>\n<div class=\"qz-qtext\"><div>\n<p>What type of program behavior would you expect to happen when the following script is manually activated?</p>\n<p><img src=\"media/web_resources/assessment_questions/if.JPG\" alt=\"if.JPG\" width=\"299\" height=\"195\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> Short movement by sprite and a possible rotation.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Sprite will move back and forth across the screen.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Sprite will move across screen and turn 90 to the right each time it hits a wall.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> No action</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Broadcast Events</h3>\n<div class=\"qz-qtext\"><div>\n<p>Predict the behavior of the following scripts when the green flag is clicked.</p>\n<p><img src=\"media/web_resources/Scratch-Q01P-01.PNG\" alt=\"\" width=\"581\" height=\"373\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> The sprite will say &quot;Beta&quot; followed by &quot;Charlie&quot;</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Alpha&quot;, followed by &quot;Beta&quot;, followed by &quot;Charlie&quot;</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Charlie&quot; only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Beta&quot; only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Alpha&quot; only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will continuously say &quot;Alpha&quot;, &quot;Beta&quot;, &quot;Charlie&quot; over and over forever.</li>\n</ul>\n</div>\n</div>"},{"id":"g71961a6a70278d18dc49a324d707a36d","kind":"assignment","title":"Scratch Artist","nav_title":"Scratch Artist","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p dir=\"ltr\"><img src=\"media/web_resources/Uploaded-Media/artist.PNG\" alt=\"artist.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/268938327\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p dir=\"ltr\">This will add all of the pen blocks that you’ll need for this project.</p>\n<p><br><br></p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Base Feature Requirements</strong></span></p>\n<p>&nbsp;</p>\n<p dir=\"ltr\"><i>Completing the following basic features will allow for a maximum grade of 9/10. The remaining Challenge Features will account for the remaining 1 mark.</i></p>\n<p>&nbsp;</p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Create a program that features one sprite (choose any that you want). When the green flag is pressed, this sprite should begin at the origin (0,0), and choose a random direction to move automatically<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">As it moves, it should use the pen to draw a trail of its motion.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Whenever an edge of the stage is encountered, the sprite should bounce.</p>\n</li>\n<li dir=\"ltr\">Movement must use the&nbsp;<strong>move</strong><strong> block.</strong>&nbsp; No <span style=\"text-decoration: underline;\">glides</span> or <span style=\"text-decoration: underline;\">goto</span> blocks for this feature.</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<ol start=\"2\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">This project should include both<span>&nbsp;</span><strong>background<span>&nbsp;</span></strong><strong>music<span>&nbsp;</span></strong>as well as<span>&nbsp;</span><strong>sound<span>&nbsp;</span></strong><strong>effects</strong>.<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">When the green flag is pressed, start some background music. This should play continually until the user stops the program.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Have a sound effect play whenever the sprite bounces on the edges of the stage<br>&nbsp; &nbsp; &nbsp; <span style=\"color: #e03e2d;\">HINT:</span>&nbsp; &nbsp;<span style=\"color: #7e8c8d;\">The <img src=\"media/web_resources/Uploaded-Media/Scratch-If-on-edge-bounce.PNG\" alt=\"Scratch - If on edge bounce.PNG\" width=\"127\" height=\"53\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/269192261\" data-api-returntype=\"File\" loading=\"lazy\"> is needed, but you have your program handle the sound effect&nbsp;<strong>first.</strong> This is because the \"bounce\" action spins the character and often they will no longer be touching the edge. Use <img src=\"media/web_resources/Uploaded-Media/Scratch-If-touching-edge.PNG\" alt=\"Scratch - If touching edge.PNG\" width=\"214\" height=\"87\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/269192398\" data-api-returntype=\"File\" loading=\"lazy\"> to help with adding a sound effect each time the sprite runs into the edge of the stage.</span></p>\n</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<ol start=\"3\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">Allow the pen characteristics to be modified by the user as follows:<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>Z key</strong><span>&nbsp;</span>will decrease the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>X key</strong><span>&nbsp;</span>will increase the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>C key</strong><span>&nbsp;</span>will change the colour of the pen</p>\n</li>\n<li>The<strong><span>&nbsp;</span>R key</strong><span>&nbsp;</span>will reset the drawing (erase all)</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Challenge Features</strong></span><br><br></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Add a second sprite into the sketch, whose<span>&nbsp;</span><strong>movement will be controlled by the user</strong>.</p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use the four arrow keys ( &nbsp;↑ ← ↓ → ) to control the sprite’s x-position and y-position.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use pen commands to make this sprite draw a line wherever it moves</p>\n</li>\n</ul>\n<p>&nbsp;</p>\n</li>\n<li>Allow this sprite’s <strong>pen size</strong> and <strong>pen colour </strong>to be changed whenever this sprite touches the other (bouncing) sprite, according to the following scheme:\n<ul>\n<li>If the user-controlled sprite is on the left half of the screen:\n<ul>\n<li>Change the pen size by 2</li>\n</ul>\n</li>\n<li>If the user-controlled sprite is on the right half of the screen:\n<ul>\n<li>Change the pen colour by 10</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p dir=\"ltr\">&nbsp;</p>\n\n"},{"id":"g0c3d2c9fc83798f3424d2eec9f96f4da","kind":"assignment","title":"Make an Interactive Short Story","nav_title":"Make an Interactive Short Story","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 5.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3,zip</span></div><p>To experiment with <i>creating your own events</i> <i>with broadcasts and taking user inpu</i><i>t</i>, create an interactive short story or play. Create characters, experiment with moving sprites around the stage – it’s up to you!</p>\n<p><strong><img src=\"media/web_resources/Uploaded-Media/Interactive-A2-01.PNG\" alt=\"Interactive A2 - 01.PNG\" width=\"708\" height=\"252\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/242887403\" data-api-returntype=\"File\" loading=\"lazy\"><br></strong></p>\n<p><strong>Base Features<br></strong></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Within your story, you must include the following components:</p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">At least one Backdrop</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">At least two characters</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">At least<strong> five broadcast statements</strong></p>\n</li>\n</ul>\n<p><span style=\"color: var(--ic-brand-font-color-dark); font-family: inherit; font-size: 1rem;\">Broadcasts must be named appropriately (“bear appears” rather than “message1\")<br><br></span></p>\n</li>\n<li dir=\"ltr\">\n<p><span style=\"color: var(--ic-brand-font-color-dark); font-family: inherit; font-size: 1rem;\">Ask the user at least one question (using the ask block)</span></p>\n</li>\n</ol>\n<div class=\"editor-indent\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>The <strong>answer to this question </strong>should be used in an IF or IF/ELSE statement so that the user’s response impacts what happens in the story.</li>\n</ul>\n</li>\n</ul>\n</div>\n<p><img src=\"media/web_resources/Uploaded-Media/Interactive-A2-02.PNG\" alt=\"Interactive A2 - 02.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/242887786\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><strong>Challenge Features</strong></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Incorporate a second user-input question that is used in a condition</p>\n</li>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Using the <strong>ask </strong>block for user-input</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Using the answer block inside an <strong>IF</strong> or<strong> IF/ELSE </strong>blocks<br><br></p>\n</li>\n</ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Include some image or costume effects that are applied depending on the user’s input</p>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p><strong>Outcomes</strong></p>\n<p>CP1, FP3</p>\n\n"},{"id":"g950486a827c541cbbff0f8a710f54008","kind":"page","title":"New Page","nav_title":"Demo 1 - Sept 3","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1127337218\">https://scratch.mit.edu/projects/1127337218</a><p></p>"},{"id":"gbdfbae7866fe49cfbe5a1efb67cd34d8","kind":"page","title":"New Page","nav_title":"Demo 2 - Sept 4","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1378135008\">https://scratch.mit.edu/projects/1378135008</a><p></p>"},{"id":"gba5bb81259b04fd5a52fed03624e476c","kind":"page","title":"New Page","nav_title":"Demo 3 - Sept 4","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1378139125\">https://scratch.mit.edu/projects/1378139125</a><p></p>"},{"id":"g0c8e156692d14d86b7dd7482a7e31037","kind":"page","title":"New Page","nav_title":"Demo 4 - Sept 8","published":true,"content_html":"https://scratch.mit.edu/projects/1379180215<p></p>"},{"id":"g107b43f2cd724b98b35a0fe09a2c76ed","kind":"page","title":"New Page","nav_title":"Demo 5 - Sept 9","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1379547482\">https://scratch.mit.edu/projects/1379547482</a><p></p>"},{"id":"gd573a6281d5e493bbd9a59d99eb3210c","kind":"page","title":"New Page","nav_title":"Scratch Quiz 1: Stage, Broadcast, Sounds","published":true,"content_html":"<a href=\"https://docs.google.com/forms/d/e/1FAIpQLScedvLwvCU6SBttZHm8q2va1PtP1KXKS8XFJz7DJw_8neM4dw/viewform?usp=publish-editor\">https://docs.google.com/forms/d/e/1FAIpQLScedvLwvCU6SBttZHm8q2va1PtP1KXKS8XFJz7DJw_8neM4dw/viewform?usp=publish-editor</a><p></p>"},{"id":"g2e8b0cc1c8264c4fbdcea8592968bafe","kind":"page","title":"New Page","nav_title":"Demo 6 - Sept 11","published":true,"content_html":"https://scratch.mit.edu/projects/1380267941<p></p>"},{"id":"g01b34341444346fbbf76b27a38759ddc","kind":"page","title":"New Page","nav_title":"Demo 7 - Sept 14","published":true,"content_html":"https://scratch.mit.edu/projects/1381071161<p></p>"},{"id":"g8f0260fb6c1c452ba2e028d08bfa2a30","kind":"page","title":"New Page","nav_title":"Demo 8 - Sept 14","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1381081390\">https://scratch.mit.edu/projects/1381081390</a><p></p>"},{"id":"g8808670fec9a4de1ad246c6c88db3989","kind":"page","title":"New Page","nav_title":"Demo 9 - Sept 17","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1217301680\">https://scratch.mit.edu/projects/1217301680</a><p></p>"},{"id":"g4b01ad51a1564a9e9a3fb5708784f3a8","kind":"page","title":"New Page","nav_title":"Demo 10 - Sept 18","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1382263776\">https://scratch.mit.edu/projects/1382263776</a>"},{"id":"g46afac96969648d2b47bf5ffbeefd705","kind":"page","title":"New Page","nav_title":"Demo 11 - Sept 19","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1382635331\">https://scratch.mit.edu/projects/1382635331</a><p></p>"}]},{"id":"g723b07093524102ff34fc22935e12d83","slug":"05-scratch-02-decision-making-and-repetition","title":"Scratch 02: Decision-Making and Repetition","order":5,"items":[{"id":"g46d23a5db0236ffac985e661c5235cb3","kind":"file","title":"Sheet.png","nav_title":"Costume Demo: Sheet.png","position":1,"published":true,"media_path":"media/web_resources/Sheet.png"},{"id":"g53af58e669bd7149167cf832846c9e3e","kind":"file","title":"Gorilla Sprites.zip","nav_title":"Costume Demo: Gorilla Sprites.zip","position":2,"published":true,"media_path":"media/web_resources/Gorilla-Sprites.zip"},{"id":"gca2254f1cb22cf3a04199e7e0ec5dfc4","kind":"weblink","title":"itch.io Free Sprite Assets","nav_title":"itch.io Free Sprite Assets","position":3,"published":true,"external_url":"https://itch.io/game-assets/free/tag-sprites"},{"id":"g1682351047766026f8293acd959d8342","kind":"assignment","title":"Costume Changer","nav_title":"Costume Changer","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p>This program should showcase your ability to create more complex animations through the use of sprite costumes.<br><img src=\"media/web_resources/Uploaded-Media/Scratch-M02-A02-I01.png\" alt=\"Scratch M02 - A02 - I01.png\" width=\"825\" height=\"184\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/241852529\" data-api-returntype=\"File\" loading=\"lazy\"><br>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Base Features&nbsp;</strong></span></p>\n<ol style=\"list-style-type: decimal;\">\n<li>At least one sprite from the sprite library move around the stage autonomously (not controlled by the user) and cycle through its costumes appropriately. Make sure to choose a sprite that has more than one costume!<br><br>\n</li>\n<li>A sprite from a custom spritesheet should be controlled by user keyboard input (arrow keys).<br><br>\n<ul style=\"list-style-type: disc;\">\n<li>searching for \"spritesheet\" will yield many options. Refer to the videos below for how to rip images from a spritesheet and upload them to Scratch.</li>\n<li>animate this sprite by cycling through costumes using a repeat (loop) block.</li>\n<li>There must be at least 4 costumes in the animation that is continually being cycled.</li>\n</ul>\n</li>\n<li>\n<p>If you are working on a computer without any graphics applications installed, there are web-based alternatives. One option is <a href=\"https://www.photopea.com/\">https://www.photopea.com/</a></p>\n</li>\n<li>\n<p>Your program should use <strong>two different backdrops</strong>. One should be displayed when the sprite controlled by the user is on the left half of the stage, and the other should be used when that sprite is on the right half.</p>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Challenge Features</strong></span></p>\n<ol>\n<li>\n<p>Add 2 additional \"actions\" (additional sets of animation frames)&nbsp; that are displayed through the use of different costumes and are activated by keyboard input.</p>\n<ul style=\"list-style-type: disc;\">\n<li>When no buttons are pressed, an&nbsp;<strong>idle animation</strong> should continue to loop</li>\n<li>You'll need to use some logic to distinguish between when&nbsp;<em>particular buttons are pressed</em> and&nbsp;<em>when those particular buttons are&nbsp;<strong>not pressed...</strong></em>\n</li>\n</ul>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Sample Output</strong></span></p>\n<p><em>A solution may look something like this example:</em></p>\n<div>\n<div>\n<div id=\"id_videojs_626979d16e6d6_1\" title=\"gJKXc8uxObw\" role=\"region\" aria-label=\"Video Player\" data-setup-lazy=\"{&quot;techOrder&quot;: [&quot;youtube&quot;], &quot;sources&quot;: [{&quot;type&quot;: &quot;video/youtube&quot;, &quot;src&quot;:&quot;https://youtu.be/gJKXc8uxObw&quot;}], &quot;language&quot;: &quot;en&quot;, &quot;fluid&quot;: true}\">\n<div><iframe id=\"id_videojs_626979d16e6d6_1_youtube_api\" title=\"YouTube video player\" src=\"https://www.youtube.com/embed/gJKXc8uxObw?controls=0&amp;modestbranding=1&amp;rel=0&amp;showinfo=0&amp;loop=0&amp;fs=0&amp;hl=en&amp;enablejsapi=1&amp;origin=https%3A%2F%2Fmoodle4u.portagecollege.ca&amp;widgetid=1\" width=\"640\" height=\"360\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" data-mce-fragment=\"1\" loading=\"lazy\"></iframe></div>\n</div>\n</div>\n</div>\n<p><br><br><span style=\"font-size: 14pt;\"><strong>How to Rip images from a Spritesheet</strong></span><br>Using Photoshop (if you have access to it):&nbsp; &nbsp; &nbsp;</p>\n<div>\n<div>\n<div id=\"id_videojs_626979d16e897_2\" title=\"watch\" role=\"region\" aria-label=\"Video Player\" data-setup-lazy=\"{&quot;techOrder&quot;: [&quot;youtube&quot;], &quot;sources&quot;: [{&quot;type&quot;: &quot;video/youtube&quot;, &quot;src&quot;:&quot;https://www.youtube.com/watch?v=Sbtq5qoeJFQ&quot;}], &quot;language&quot;: &quot;en&quot;, &quot;fluid&quot;: true}\">\n<div><iframe id=\"id_videojs_626979d16e897_2_youtube_api\" title=\"YouTube video player\" src=\"https://www.youtube.com/embed/Sbtq5qoeJFQ?controls=0&amp;modestbranding=1&amp;rel=0&amp;showinfo=0&amp;loop=0&amp;fs=0&amp;hl=en&amp;enablejsapi=1&amp;origin=https%3A%2F%2Fmoodle4u.portagecollege.ca&amp;widgetid=2\" width=\"640\" height=\"360\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" data-mce-fragment=\"1\" loading=\"lazy\"></iframe></div>\n</div>\n</div>\n</div>\n<p>&nbsp;</p>\n<p>Using Photopea (free, web-based):&nbsp; &nbsp;</p>\n<div>\n<div>\n<iframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/YuIzYZ9UbJ0\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" data-mce-fragment=\"1\" loading=\"lazy\"></iframe>\n<div>\n<p dir=\"ltr\">&nbsp;</p>\n<p id=\"yui_3_17_2_1_1650866815541_30\" dir=\"ltr\"><span style=\"font-family: verdana, geneva, sans-serif; font-size: 14pt;\"><strong>Submission Details</strong></span><br><br></p>\n<p style=\"padding-left: 40px;\" dir=\"ltr\">For this project, you should submit your work as a&nbsp;<strong>.sb3 file.</strong></p>\n<p style=\"padding-left: 40px;\" dir=\"ltr\">You can download the sb3 file directly from the scratch editor.&nbsp;&nbsp;<strong>File → Save to your Computer<br><br></strong><strong><img src=\"media/web_resources/Uploaded-Media/Scratch-Save-to-your-computer.png\" alt=\"Scratch - Save to your computer.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/241852364\" data-api-returntype=\"File\" loading=\"lazy\"><br>&nbsp;</strong></p>\n</div>\n</div>\n</div>\n\n"},{"id":"g3be3ffe98293ec6a0dd7631ca8f82e5a","kind":"page","title":"Videos: Extracting Costumes from Spritesheets","nav_title":"Videos: Extracting Costumes from Spritesheets","position":5,"published":true,"content_html":"<p><span style=\"font-size: 14pt;\"><strong>How to Rip images from a Spritesheet</strong></span></p>\n<p>Using Photopea (free, web-based):&nbsp; &nbsp;</p>\n<div>\n<div><iframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/YuIzYZ9UbJ0\" width=\"560\" height=\"315\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" data-mce-fragment=\"1\"></iframe>\n<div>\n<p dir=\"ltr\">&nbsp;</p>\n</div>\n</div>\n</div>\n<p>Using Photoshop (if you have access to it):&nbsp; &nbsp; &nbsp;</p>\n<div>\n<div>\n<div id=\"id_videojs_626979d16e897_2\" title=\"watch\" role=\"region\" aria-label=\"Video Player\" data-setup-lazy=\"{&quot;techOrder&quot;: [&quot;youtube&quot;], &quot;sources&quot;: [{&quot;type&quot;: &quot;video/youtube&quot;, &quot;src&quot;:&quot;https://www.youtube.com/watch?v=Sbtq5qoeJFQ&quot;}], &quot;language&quot;: &quot;en&quot;, &quot;fluid&quot;: true}\">\n<div><iframe id=\"id_videojs_626979d16e897_2_youtube_api\" title=\"YouTube video player\" src=\"https://www.youtube.com/embed/Sbtq5qoeJFQ?controls=0&amp;modestbranding=1&amp;rel=0&amp;showinfo=0&amp;loop=0&amp;fs=0&amp;hl=en&amp;enablejsapi=1&amp;origin=https%3A%2F%2Fmoodle4u.portagecollege.ca&amp;widgetid=2\" width=\"640\" height=\"360\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" data-mce-fragment=\"1\"></iframe></div>\n</div>\n</div>\n</div>\n<p>&nbsp;</p>\n\n"},{"id":"g10389b762d364a419b4cf6f0ae851da7","kind":"page","title":"New Page","nav_title":"Demo 12 - Sept 22","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1383412415\">https://scratch.mit.edu/projects/1383412415</a><p></p>"},{"id":"gf3c7a1f001674eadbafb3050409f5626","kind":"page","title":"New Page","nav_title":"Robot Problem","published":true,"content_html":"<a href=\"https://docs.google.com/presentation/d/e/2PACX-1vS40EeeXwmWbXSFXJATfFJK9uktAz1YD2m398sT4bWj-h8cvc747KpCeo9t9fBvG57PhMV4u1estFLr/pub?start=false&amp;loop=false&amp;delayms=3000&amp;slide=id.g26a271a4aae_0_10\">https://docs.google.com/presentation/d/e/2PACX-1vS40EeeXwmWbXSFXJATfFJK9uktAz1YD2m398sT4bWj-h8cvc747KpCeo9t9fBvG57PhMV4u1estFLr/pub?start=false&amp;loop=false&amp;delayms=3000&amp;slide=id.g26a271a4aae_0_10</a><p></p>"},{"id":"g324808176a7945e693fc8d67c9b437d7","kind":"page","title":"New Page","nav_title":"Demo 13 - Sept 25","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1385042374\">https://scratch.mit.edu/projects/1385042374</a><p></p>"},{"id":"ga84d333dbcfd4edca3f18a5f9e02286d","kind":"page","title":"New Page","nav_title":"Demo 14 - Sept 25","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1385047842\">https://scratch.mit.edu/projects/1385047842</a><p></p>"},{"id":"ge866d094ca9642e9af041431ddec24a2","kind":"page","title":"New Page","nav_title":"Practice Quiz Two: Basics, Decisions, and Loops","published":true,"content_html":"<a href=\"https://docs.google.com/forms/d/e/1FAIpQLSeGvueo04GhbL22ezHzRvNXaUkDCFXWEZUat3Mf3ymOf15g-g/viewform?usp=publish-editor\">https://docs.google.com/forms/d/e/1FAIpQLSeGvueo04GhbL22ezHzRvNXaUkDCFXWEZUat3Mf3ymOf15g-g/viewform?usp=publish-editor</a><p></p>"},{"id":"gf87e428bb1af469aba0fc78ffb45bacf","kind":"page","title":"New Page","nav_title":"Quiz 2","published":true,"content_html":"https://docs.google.com/forms/d/e/1FAIpQLSfFF1tUfZfUoULWMyJWriiyCL-Lyk91IRcYdboE7hLMZCFpvw/viewform?usp=dialog"}]},{"id":"g006dd7d12c54c4c6bb158178d01ffe26","slug":"06-scratch-03-variables","title":"Scratch 03: Variables","order":6,"items":[{"id":"g09d172fa889345812ea7979e738249a8","kind":"file","title":"Variables and Data.pptx","nav_title":"Variables and Data.pptx","position":2,"published":true,"media_path":"media/web_resources/Variables-and-Data.pptx"},{"id":"gbdbea40795ddfbf680df929bb128f874","kind":"page","title":"Flow Charts + Pair Programming Challenge","nav_title":"Flow Charts + Pair Programming Challenge","position":3,"published":true,"content_html":"<p><iframe src=\"https://docs.google.com/presentation/d/e/2PACX-1vS-7HBBDjWRoZrNsJVhiI6aMYxX1BnA4aeMcUyeugLn5svZFzrOYYbJYjQDg0qKssxdZOwnrcm1fZbp/embed?start=false&amp;loop=false&amp;delayms=3000\" width=\"960\" height=\"569\" allowfullscreen=\"allowfullscreen\" webkitallowfullscreen=\"webkitallowfullscreen\" mozallowfullscreen=\"mozallowfullscreen\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"gd1a181af0e221341b0aa483f05733908","kind":"assignment","title":"Math Grapher","nav_title":"Math Grapher","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p><span style=\"font-size: 18pt;\"><strong>Slope of a Line:</strong></span></p>\n<p>The slope of a line tells us whether it is rising or falling, as well as how steep it is.<br><img src=\"media/web_resources/Uploaded-Media/Scratch-A01-I06.jpg\" alt=\"Scratch - A01 - I06.jpg\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245750092\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em>To complete this project, you’ll need to be able to calculate the slope of a line. Hopefully, this is a familiar operation, but if you’d like a refresher please check out the following video:</em></p>\n<p><iframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/WkspBxrzuZo?si=g4hvjnL0KnfQWpUc\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" loading=\"lazy\"></iframe></p>\n<p><br><br><br><span style=\"font-size: 18pt;\"><strong>Adding the Pen Extension:</strong></span><strong></strong></p>\n<p>For this project, you’ll need to add the pen extension as you did earlier.<br><br><img src=\"media/web_resources/Uploaded-Media/Scratch-A-Extensions.png\" alt=\"Scratch - A - Extensions.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245750145\" data-api-returntype=\"File\" loading=\"lazy\"><br><span><em>To add an extension, first, find the “add extension” button in the bottom left corner.</em></span></p>\n<p><span><em><br><img src=\"media/web_resources/Uploaded-Media/Scratch-A1-Pen-Extension.png\" alt=\"Scratch - A1 - Pen Extension.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245750206\" data-api-returntype=\"File\" loading=\"lazy\"><br>Then choose the extension called “pen”.</em></span><em></em></p>\n<p><br><br><br><span style=\"font-size: 18pt;\"><strong>Base Features Requirements&nbsp;</strong></span></p>\n<ol style=\"list-style-type: decimal;\">\n<li>Create a program that begins by asking the user for <strong>4 inputs</strong>, and stores each in its own <strong>variable:</strong>\n<ul style=\"list-style-type: disc;\">\n<li>A X-value for the first point of a line segment</li>\n<li>A Y-value for the first point of a line segment</li>\n<li>A X-value for the second point of a line segment</li>\n<li>A Y-value for the second point of a line segment<br><br>\n</li>\n</ul>\n</li>\n<li>Once this data has been stored, have a sprite (which can be visible&nbsp;<strong>or</strong> invisible) draw that particular line segment on the screen using the&nbsp;<strong>pen blocks.</strong><br><br>\n</li>\n<li>Given the line drawn,&nbsp;<strong>calculate the slope of this line</strong> and store it in a variable.<br><br>\n</li>\n<li>Have your sprite report what the line's slope is for&nbsp;<strong>2 seconds.</strong>\n<ul style=\"list-style-type: disc;\">\n<li>If you've used the <strong>hide block</strong>, the say block won't show up on the stage!</li>\n<li>At this point, either make sure to&nbsp;<strong>show</strong> the sprite, or use <strong>set ghost effect to 100</strong> instead; this hides the sprite but still allows text to be displayed.<br><br>\n</li>\n</ul>\n</li>\n<li>At this point, the base features are complete!<br><br><br><br>\n</li>\n</ol>\n<p><span style=\"font-size: 18pt;\"><strong>Challenge Features Requirements&nbsp;</strong></span><em> (Parallelogram Area Calculator)<br><br></em>A <strong>Parallelogram </strong>can be created with <span style=\"text-decoration: underline;\">two sets of lines</span> that are <span style=\"text-decoration: underline;\">parallel to each other</span>. Expand the program above to add a horizontal line to both endpoints of the user’s original line segment. Then, add a copy of the original line segment to the end of these horizontal segments to complete a parallelogram. Lastly, report the area of this closed shape. Some additional explanation is below:<em><br></em></p>\n<ol style=\"list-style-type: decimal;\">\n<li><span>Draw Original Line Segment - If you've completed the <strong>base features</strong> then this is already done! See more details up there...<br><br></span></li>\n<li><span>Ask the user for a horizontal distance - store this value in a variable, then use it to draw two horizontal lines attached to each endpoint of the original line segment:<br><img src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I02.PNG\" alt=\"Scratch- WO3 - A02 - I02.PNG\" width=\"447\" height=\"215\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245751296\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></span></li>\n<li><span>Using that value, draw two horizontal lines segments of that length from each of the two existing endpoints (Remember, you should have these (x,y) locations stored in variables already)<br><img src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I03.PNG\" alt=\"Scratch- WO3 - A02 - I03.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245751365\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></span></li>\n<li><span>To finish the parallelogram, draw a line segment with the same length and slope as the first, but starting and ending at the free horizontal endpoints. (Note: the sprite that is enacting these scripts can be visible or hidden while drawing)<br><img src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I04a.PNG\" alt=\"Scratch- WO3 - A02 - I04a.PNG\" width=\"307\" height=\"149\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245752229\" data-api-returntype=\"File\" loading=\"lazy\"> &nbsp;<img src=\"media/web_resources/Uploaded-Media/CSCR-WO3-A02-I04b.PNG\" alt=\"CSCR - WO3 - A02 - I04b.PNG\" width=\"298\" height=\"130\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245752232\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></span></li>\n<li><span>Once the shape has been drawn, calculate what the area of the parallelogram is. If you don’t have the formula memorized (I didn’t!), you may need to do an internet search to find it. It is very readily available. Calculate the area and store it in an appropriately-named variable.<br><br></span></li>\n<li><span>Lastly, have the sprite report what the area is. The sprite will need to be visible at this point in order for its speech bubble to be visible as well.<br><img src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I05.PNG\" alt=\"Scratch - WO3 - A02 - I05.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245752341\" data-api-returntype=\"File\" loading=\"lazy\"><br></span></li>\n</ol>\n\n"},{"id":"g25b07154428d3494746d352b91fcee2f","kind":"file","title":"Patterns and Pattern Recognition.pptx","nav_title":"Patterns and Pattern Recognition.pptx","position":10,"published":true,"media_path":"media/web_resources/Patterns-and-Pattern-Recognition.pptx"}]},{"id":"g64f83bde275725d4a7f26c354a42fa1e","slug":"07-scratch-04-major-project","title":"Scratch 04: Major Project","order":7,"items":[{"id":"g0f7ae95d99d2bfbcce76603c66eaf4f8","kind":"assignment","title":"Coolest Scratch Assignment","nav_title":"Coolest Scratch Assignment","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 16.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online url,online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3,zip</span></div><p><span><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/Scratch-Major-Project-Examples.png\" alt=\"\" width=\"515\" height=\"385\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/11226751/files/285771568\" data-api-returntype=\"File\" loading=\"lazy\"></span></p>\n<p>&nbsp;</p>\n<p><span>This is an open-ended assignment, where you will show some evidence of your learning in the class so far. There are just a couple of stipulations:</span><span><br><br></span></p>\n<p><span style=\"font-size: 14pt;\"><strong>Open-Ended Topic</strong></span><span><br></span><span><br></span><span>For this project, you should create the coolest, most interesting thing you can in Scratch with what you’ve learned so far. This could be a game, an interactive program, or some sort of productivity software (a program that helps complete a task). Be sure to choose something that you’ll find interesting to work on for a full week!</span><span><br><br></span></p>\n<p><span style=\"font-size: 14pt;\"><strong>Included Concepts</strong></span><span><br></span><span><br></span><span>This project is an opportunity to showcase all the concepts you’ve gained experience with over the past few weeks, and you must be sure to include all of the following </span><i><span>in some useful form</span></i><span>:</span><span><br><br></span></p>\n<ul style=\"list-style-type: disc;\">\n<li><span>Broadcasts</span></li>\n<li>Loops (must include both a <strong>condition</strong> and <strong>counting</strong> loop)</li>\n<li>Conditionals ( IF / ELSE )</li>\n<li>Variables</li>\n<li>A Function without inputs</li>\n<li>A Function with at least one input</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong><span style=\"font-size: 14pt;\">Complexity</span></strong><span><br></span><span><br></span><span>As you're being given a full week to work on this project, its complexity should represent a 5-6 hours of dedicated work! Part of the grading rubric for the project will be that it’s complexity represents that amount of time commitment.</span><span><br></span></p>\n<p>In this project, you should aim to <i>develop your skills </i>by exploring further an idea touched on in class (ie working with lists, clones), or something we didn't address at all. By the end of the project you should be able to describe something new you were able to accomplish in your program.</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Documentation</strong></span><br><br>All programs should be accompanied by some form of documentation, which explains to users what the purpose of the software is as well as how to interact correctly with it. For this project, you'll need to submit a&nbsp;<strong>minimum 1-page</strong> documentation/reflection. Specific requirements can be seen in the module item <a title=\"Scratch Project Documentation\" href=\"#item:g6c73fc015a3d4a433bd0d4aa5a4e89a3\" data-course-type=\"assignments\" data-published=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/11226751/assignments/52831719\" data-api-returntype=\"Assignment\" data-item-ref=\"g6c73fc015a3d4a433bd0d4aa5a4e89a3\">\"Scratch Project Documentation\"</a>. This is submitted separately from the Major Project, but comprises 20% of the overall project grade.<span><br></span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Your Ideas, Your Code</strong></span><span><br></span><span><br></span><span>Choose a topic/premise that you'll enjoy working on for several days, and I hope you'll have fun with this project! A few things:<br><br></span></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>\n<span>This project should be of your own design. (Don't follow along with a tutorial or remix someone else's work)</span>\n<ul>\n<li><span>However, the premise can be something you've seen elsewhere. <em>(For instance, planning to recreate the game \"Battleship\" is fine, as long as your version is made by you from scratch).<br><br></em></span></li>\n</ul>\n</li>\n<li>\n<span>You are welcome to look at others projects on the Scratch website to get ideas and study how they have made their projects, but you shouldn't have your program open at the same time.&nbsp; </span>\n<ul>\n<li><span>As well, If you take a specific idea from another project, video resource, or similar, you must attribute/cite it appropriately in your documentation.&nbsp;</span></li>\n<li><span><strong>Failing to do so is plagiarism</strong>, so please ensure to take care of this step if needed.</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>Outcomes</strong></p>\n<p>CP1, CP2, FP1, FP2, FP3</p>\n\n"},{"id":"g6c73fc015a3d4a433bd0d4aa5a4e89a3","kind":"assignment","title":"Scratch Project Documentation","nav_title":"Scratch Project Documentation","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 4.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> txt,rtf,doc,docx</span></div><p><span>Good documentation is an important component of any computer program; it informs users how to use your software, and makes it possible for other programmers – who might be taking over a project – to understand how it works!</span></p>\n<p><span>For our class, you can use the following structure when documenting your code:</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\">Basic Instructions and Explanation</span></p>\n<p><span>In a text document (word, pdf, txt), address the following topics. Be thorough – you should not assume that the user has any background knowledge of your program; your documentation should allow a beginner to successfully understand and operate your software. </span><i><span>As a reference point, this should not be shorter than a page (single spaced), and will be graded according to whether this amount of length was met, and that all five sections below were reflected on appropriately. (250 words +)<br><br></span></i></p>\n<ol>\n<li>\n<span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><strong>Basic Premise</strong>\n</li>\n</ol>\n<p><span>Explain what the program is. If it is for productivity, describe how the program will assist the user with a task. If it is a game, describe the type of game and any relevant backstory.<br><br></span></p>\n<ol start=\"2\">\n<li>\n<span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><strong>Key Features</strong>\n</li>\n</ol>\n<p><span>A summary of the different features or capabilities of the program. If applicable, provide a breakdown description of each feature. Explain what the user needs to do to in order to make the program work correctly.<br><br></span></p>\n<ol start=\"3\">\n<li>\n<span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><strong>Controls / Game Mechanics</strong>\n</li>\n</ol>\n<p><span>Provide a listing of the different user input controls. If a user forgets what buttons they need to press on the keyboard or what to click, they should be able to look it up.<br><br></span></p>\n<ol start=\"4\">\n<li>\n<span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><strong>Limitations</strong>\n</li>\n</ol>\n<p><span>If there are known bugs or issues with the program (ways that the user can break the program) that you have been unable to fix, list the problems and potential workarounds.<br><br></span></p>\n<ol start=\"5\">\n<li>\n<strong> &nbsp;&nbsp;</strong> <strong>Personal Comments</strong>\n</li>\n</ol>\n<p><span>As the author of the program, add a short reflection on the program.&nbsp;</span></p>\n<ul>\n<li><span>What new ideas or challenging aspects of the program did you tackle?</span></li>\n<li><span>If you had more time, how would you extend this program?</span></li>\n<li><span>Add any other reflections you have on your project.</span></li>\n</ul>\n\n"},{"id":"gf12c6ad3df3c35cf607a8ff9ff492431","kind":"page","title":"Examples of Scratch Projects","nav_title":"Examples of Scratch Projects","position":5,"published":true,"content_html":"<p><iframe src=\"https://docs.google.com/presentation/d/e/2PACX-1vToCtlOVeSB7HVUsNKmWFI4Om4hXp5qaEaWuGW1JRt9B1CztndCiIBBoJ9uM3Wm6dklbNjsh_nQvpM8/embed?start=false&amp;loop=false&amp;delayms=3000\" width=\"960\" height=\"569\" allowfullscreen=\"allowfullscreen\" webkitallowfullscreen=\"webkitallowfullscreen\" mozallowfullscreen=\"mozallowfullscreen\" loading=\"lazy\"></iframe></p>\n\n"}]}],"unfiled":[]}</script>
