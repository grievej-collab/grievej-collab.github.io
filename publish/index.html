and Problem Solving","position":1,"published":true,"content_html":"<iframe src=\"https://docs.google.com/presentation/d/1h1kareIz2HPio5z1AHoqVAen3pp8zlx0Q4YoVPjZuzk/embed?start=false&amp;loop=false&amp;delayms=3000\" frameborder=\"0\" width=\"960\" height=\"569\" allowfullscreen=\"true\" mozallowfullscreen=\"true\" webkitallowfullscreen=\"true\" loading=\"lazy\"></iframe>\n\n"},{"id":"g72fc221d8c5d105eb574b8a34b6f7d8b","kind":"page","title":"Broadcasts: Code-Driven Events","nav_title":"Broadcasts: Code-Driven Events","position":2,"published":true,"content_html":"<p><iframe src=\"https://docs.google.com/presentation/d/e/2PACX-1vTC4f3h_jIHjVho5fzK0w4WyRMAMg6pt_AFoMKnBts4vqLBvua6BbgcfkN4BczFYgPj5TgxGNMBY3Nx/embed?start=false&amp;loop=false&amp;delayms=3000\" width=\"960\" height=\"569\" allowfullscreen=\"allowfullscreen\" webkitallowfullscreen=\"webkitallowfullscreen\" mozallowfullscreen=\"mozallowfullscreen\" loading=\"lazy\"></iframe></p>\n\n"}]},{"id":"gdcd327faba249ba761dbab487cb3232c","slug":"04-scratch-01-visual-programming-and-problem-solving","title":"Scratch 01:  Visual Programming and Problem-Solving","order":4,"items":[{"id":"g19b772f0930e01ce379854a4d39d0b98","kind":"file","title":"Scratch Environment and Problem Solving.pptx","nav_title":"Scratch Environment and Problem Solving.pptx","position":1,"published":true,"media_path":"media/web_resources/Scratch-Environment-and-Problem-Solving.pptx"},{"id":"gaf5e2a20b8a9e1de94bc40c4ca141a03","kind":"quiz","title":"Practice Quiz One:  Stage, Broadcasts, Sounds","nav_title":"Practice Quiz One:  Stage, Broadcasts, Sounds","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 6.0</span></div><p>This practice quiz is connected to our first few days of class, and will help prepare you for the first graded quiz!</p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of </span><span>4</span><span>8</span><span>0</span><span> and a stage height of </span><span>3</span><span>6</span><span>0</span><span>,</span><span> what is the current y-position of Scratch?</span></p>\n<p><span><img src=\"https://sps.blackboard.com/bbcswebdav/xid-1294534_1\" alt=\"\" width=\"324\" height=\"269\" loading=\"lazy\"></span></p>\n<p><img src=\"media/web_resources/W01-Q-04-.JPG\" alt=\"Stage Question\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 90</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 360</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -180</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of 480 and a stage height of 360, what is the current </span><strong>x-position</strong><span> of Scratch?</span></p>\n<p><img src=\"media/web_resources/assessment_questions/W01-Q-06.JPG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 480</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Question</h3>\n<div class=\"qz-qtext\"><div>\n<p>What type of program behavior would you expect to happen when the following script is manually activated?</p>\n<p><img src=\"media/web_resources/assessment_questions/if.JPG\" alt=\"if.JPG\" width=\"299\" height=\"195\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> Short movement by sprite and a possible rotation.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Sprite will move back and forth across the screen.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Sprite will move across screen and turn 90 to the right each time it hits a wall.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> No action</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Broadcast Events</h3>\n<div class=\"qz-qtext\"><div>\n<p>Predict the behavior of the following scripts when the green flag is clicked.</p>\n<p><img src=\"media/web_resources/Scratch-Q01P-01.PNG\" alt=\"\" width=\"581\" height=\"373\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> The sprite will say &quot;Beta&quot; followed by &quot;Charlie&quot;</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Alpha&quot;, followed by &quot;Beta&quot;, followed by &quot;Charlie&quot;</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Charlie&quot; only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Beta&quot; only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Alpha&quot; only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will continuously say &quot;Alpha&quot;, &quot;Beta&quot;, &quot;Charlie&quot; over and over forever.</li>\n</ul>\n</div>\n</div>"},{"id":"g71961a6a70278d18dc49a324d707a36d","kind":"assignment","title":"Scratch Artist","nav_title":"Scratch Artist","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p dir=\"ltr\"><img src=\"media/web_resources/Uploaded-Media/artist.PNG\" alt=\"artist.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/268938327\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p dir=\"ltr\">This will add all of the pen blocks that you’ll need for this project.</p>\n<p><br><br></p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Base Feature Requirements</strong></span></p>\n<p>&nbsp;</p>\n<p dir=\"ltr\"><i>Completing the following basic features will allow for a maximum grade of 9/10. The remaining Challenge Features will account for the remaining 1 mark.</i></p>\n<p>&nbsp;</p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Create a program that features one sprite (choose any that you want). When the green flag is pressed, this sprite should begin at the origin (0,0), and choose a random direction to move automatically<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">As it moves, it should use the pen to draw a trail of its motion.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Whenever an edge of the stage is encountered, the sprite should bounce.</p>\n</li>\n<li dir=\"ltr\">Movement must use the&nbsp;<strong>move</strong><strong> block.</strong>&nbsp; No <span style=\"text-decoration: underline;\">glides</span> or <span style=\"text-decoration: underline;\">goto</span> blocks for this feature.</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<ol start=\"2\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">This project should include both<span>&nbsp;</span><strong>background<span>&nbsp;</span></strong><strong>music<span>&nbsp;</span></strong>as well as<span>&nbsp;</span><strong>sound<span>&nbsp;</span></strong><strong>effects</strong>.<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">When the green flag is pressed, start some background music. This should play continually until the user stops the program.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Have a sound effect play whenever the sprite bounces on the edges of the stage<br>&nbsp; &nbsp; &nbsp; <span style=\"color: #e03e2d;\">HINT:</span>&nbsp; &nbsp;<span style=\"color: #7e8c8d;\">The <img src=\"media/web_resources/Uploaded-Media/Scratch-If-on-edge-bounce.PNG\" alt=\"Scratch - If on edge bounce.PNG\" width=\"127\" height=\"53\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/269192261\" data-api-returntype=\"File\" loading=\"lazy\"> is needed, but you have your program handle the sound effect&nbsp;<strong>first.</strong> This is because the \"bounce\" action spins the character and often they will no longer be touching the edge. Use <img src=\"media/web_resources/Uploaded-Media/Scratch-If-touching-edge.PNG\" alt=\"Scratch - If touching edge.PNG\" width=\"214\" height=\"87\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/269192398\" data-api-returntype=\"File\" loading=\"lazy\"> to help with adding a sound effect each time the sprite runs into the edge of the stage.</span></p>\n</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<ol start=\"3\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">Allow the pen characteristics to be modified by the user as follows:<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>Z key</strong><span>&nbsp;</span>will decrease the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>X key</strong><span>&nbsp;</span>will increase the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>C key</strong><span>&nbsp;</span>will change the colour of the pen</p>\n</li>\n<li>The<strong><span>&nbsp;</span>R key</strong><span>&nbsp;</span>will reset the drawing (erase all)</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Challenge Features</strong></span><br><br></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Add a second sprite into the sketch, whose<span>&nbsp;</span><strong>movement will be controlled by the user</strong>.</p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use the four arrow keys ( &nbsp;↑ ← ↓ → ) to control the sprite’s x-position and y-position.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use pen commands to make this sprite draw a line wherever it moves</p>\n</li>\n</ul>\n<p>&nbsp;</p>\n</li>\n<li>Allow this sprite’s <strong>pen size</strong> and <strong>pen colour </strong>to be changed whenever this sprite touches the other (bouncing) sprite, according to the following scheme:\n<ul>\n<li>If the user-controlled sprite is on the left half of the screen:\n<ul>\n<li>Change the pen size by 2</li>\n</ul>\n</li>\n<li>If the user-controlled sprite is on the right half of the screen:\n<ul>\n<li>Change the pen colour by 10</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p dir=\"ltr\">&nbsp;</p>\n\n"},{"id":"g950486a827c541cbbff0f8a710f54008","kind":"page","title":"New Page","nav_title":"Demo 1 - Sept 3","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1127337218\">https://scratch.mit.edu/projects/1127337218</a><p></p>"},{"id":"gbdfbae7866fe49cfbe5a1efb67cd34d8","kind":"page","title":"New Page","nav_title":"Demo 2 - Sept 4","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1378135008\">https://scratch.mit.edu/projects/1378135008</a><p></p>"},{"id":"gba5bb81259b04fd5a52fed03624e476c","kind":"page","title":"New Page","nav_title":"Demo 3 - Sept 4","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1378139125\">https://scratch.mit.edu/projects/1378139125</a><p></p>"},{"id":"g0c8e156692d14d86b7dd7482a7e31037","kind":"page","title":"New Page","nav_title":"Demo 4 - Sept 8","published":true,"content_html":"https://scratch.mit.edu/projects/1379180215<p></p>"},{"id":"g107b43f2cd724b98b35a0fe09a2c76ed","kind":"page","title":"New Page","nav_title":"Demo 5 - Sept 9","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1379547482\">https://scratch.mit.edu/projects/1379547482</a><p></p>"}]}],"unfiled":[]}</script>
