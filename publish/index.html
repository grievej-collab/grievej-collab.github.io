ng and Repeating Structures","position":3,"published":true,"content_html":"<iframe src=\"https://docs.google.com/presentation/d/1YuTFR_l0MJGR2ZD04QWhsULujAVp0Tmd2RtA2Odv9-g/embed?start=false&amp;loop=false&amp;delayms=3000\" frameborder=\"0\" width=\"960\" height=\"569\" allowfullscreen=\"true\" mozallowfullscreen=\"true\" webkitallowfullscreen=\"true\" loading=\"lazy\"></iframe>\n\n"},{"id":"gdd5cf817a0a21dda20a8e6f5428e7aac","kind":"page","title":"Variables and Data","nav_title":"Variables and Data","position":4,"published":true,"content_html":"<p><iframe src=\"https://docs.google.com/presentation/d/e/2PACX-1vQbWUm28rIuwCt0nmw1z0nyERg2GbLlaSsi6uoE1bIlUu6kb9hv5I4im4JaQhGPL6qLDSY4NrkPs2r3/embed?start=false&amp;loop=false&amp;delayms=3000\" width=\"960\" height=\"569\" allowfullscreen=\"allowfullscreen\" webkitallowfullscreen=\"webkitallowfullscreen\" mozallowfullscreen=\"mozallowfullscreen\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"g531f258fb3a7463123819bf52a55a587","kind":"page","title":"Flow Charts","nav_title":"Flow Charts","position":5,"published":true,"content_html":"<p><iframe src=\"https://docs.google.com/presentation/d/e/2PACX-1vS-7HBBDjWRoZrNsJVhiI6aMYxX1BnA4aeMcUyeugLn5svZFzrOYYbJYjQDg0qKssxdZOwnrcm1fZbp/embed?start=false&amp;loop=false&amp;delayms=3000\" width=\"960\" height=\"569\" allowfullscreen=\"allowfullscreen\" webkitallowfullscreen=\"webkitallowfullscreen\" mozallowfullscreen=\"mozallowfullscreen\" loading=\"lazy\"></iframe></p>\n\n"}]},{"id":"gdcd327faba249ba761dbab487cb3232c","slug":"04-scratch-01-visual-programming-and-problem-solving","title":"Scratch 01:  Visual Programming and Problem-Solving","order":4,"items":[{"id":"gaf5e2a20b8a9e1de94bc40c4ca141a03","kind":"quiz","title":"Practice Quiz One:  Stage, Broadcasts, Sounds","nav_title":"Practice Quiz One:  Stage, Broadcasts, Sounds","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 6.0</span></div><p>This practice quiz is connected to our first few days of class, and will help prepare you for the first graded quiz!</p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of </span><span>4</span><span>8</span><span>0</span><span> and a stage height of </span><span>3</span><span>6</span><span>0</span><span>,</span><span> what is the current y-position of Scratch?</span></p>\n<p><span><img src=\"https://sps.blackboard.com/bbcswebdav/xid-1294534_1\" alt=\"\" width=\"324\" height=\"269\" loading=\"lazy\"></span></p>\n<p><img src=\"media/web_resources/W01-Q-04-.JPG\" alt=\"Stage Question\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 90</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 360</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -180</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of 480 and a stage height of 360, what is the current </span><strong>x-position</strong><span> of Scratch?</span></p>\n<p><img src=\"media/web_resources/assessment_questions/W01-Q-06.JPG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 480</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Question</h3>\n<div class=\"qz-qtext\"><div>\n<p>What type of program behavior would you expect to happen when the following script is manually activated?</p>\n<p><img src=\"media/web_resources/assessment_questions/if.JPG\" alt=\"if.JPG\" width=\"299\" height=\"195\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> Short movement by sprite and a possible rotation.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Sprite will move back and forth across the screen.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Sprite will move across screen and turn 90 to the right each time it hits a wall.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> No action</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Broadcast Events</h3>\n<div class=\"qz-qtext\"><div>\n<p>Predict the behavior of the following scripts when the green flag is clicked.</p>\n<p><img src=\"media/web_resources/Scratch-Q01P-01.PNG\" alt=\"\" width=\"581\" height=\"373\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> The sprite will say &quot;Beta&quot; followed by &quot;Charlie&quot;</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Alpha&quot;, followed by &quot;Beta&quot;, followed by &quot;Charlie&quot;</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Charlie&quot; only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Beta&quot; only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say &quot;Alpha&quot; only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will continuously say &quot;Alpha&quot;, &quot;Beta&quot;, &quot;Charlie&quot; over and over forever.</li>\n</ul>\n</div>\n</div>"},{"id":"g71961a6a70278d18dc49a324d707a36d","kind":"assignment","title":"Scratch Artist","nav_title":"Scratch Artist","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p dir=\"ltr\"><img src=\"media/web_resources/Uploaded-Media/artist.PNG\" alt=\"artist.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/268938327\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p dir=\"ltr\">This will add all of the pen blocks that you’ll need for this project.</p>\n<p><br><br></p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Base Feature Requirements</strong></span></p>\n<p>&nbsp;</p>\n<p dir=\"ltr\"><i>Completing the following basic features will allow for a maximum grade of 9/10. The remaining Challenge Features will account for the remaining 1 mark.</i></p>\n<p>&nbsp;</p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Create a program that features one sprite (choose any that you want). When the green flag is pressed, this sprite should begin at the origin (0,0), and choose a random direction to move automatically<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">As it moves, it should use the pen to draw a trail of its motion.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Whenever an edge of the stage is encountered, the sprite should bounce.</p>\n</li>\n<li dir=\"ltr\">Movement must use the&nbsp;<strong>move</strong><strong> block.</strong>&nbsp; No <span style=\"text-decoration: underline;\">glides</span> or <span style=\"text-decoration: underline;\">goto</span> blocks for this feature.</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<ol start=\"2\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">This project should include both<span>&nbsp;</span><strong>background<span>&nbsp;</span></strong><strong>music<span>&nbsp;</span></strong>as well as<span>&nbsp;</span><strong>sound<span>&nbsp;</span></strong><strong>effects</strong>.<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">When the green flag is pressed, start some background music. This should play continually until the user stops the program.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Have a sound effect play whenever the sprite bounces on the edges of the stage<br>&nbsp; &nbsp; &nbsp; <span style=\"color: #e03e2d;\">HINT:</span>&nbsp; &nbsp;<span style=\"color: #7e8c8d;\">The <img src=\"media/web_resources/Uploaded-Media/Scratch-If-on-edge-bounce.PNG\" alt=\"Scratch - If on edge bounce.PNG\" width=\"127\" height=\"53\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/269192261\" data-api-returntype=\"File\" loading=\"lazy\"> is needed, but you have your program handle the sound effect&nbsp;<strong>first.</strong> This is because the \"bounce\" action spins the character and often they will no longer be touching the edge. Use <img src=\"media/web_resources/Uploaded-Media/Scratch-If-touching-edge.PNG\" alt=\"Scratch - If touching edge.PNG\" width=\"214\" height=\"87\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/269192398\" data-api-returntype=\"File\" loading=\"lazy\"> to help with adding a sound effect each time the sprite runs into the edge of the stage.</span></p>\n</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<ol start=\"3\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">Allow the pen characteristics to be modified by the user as follows:<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>Z key</strong><span>&nbsp;</span>will decrease the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>X key</strong><span>&nbsp;</span>will increase the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>C key</strong><span>&nbsp;</span>will change the colour of the pen</p>\n</li>\n<li>The<strong><span>&nbsp;</span>R key</strong><span>&nbsp;</span>will reset the drawing (erase all)</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Challenge Features</strong></span><br><br></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Add a second sprite into the sketch, whose<span>&nbsp;</span><strong>movement will be controlled by the user</strong>.</p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use the four arrow keys ( &nbsp;↑ ← ↓ → ) to control the sprite’s x-position and y-position.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use pen commands to make this sprite draw a line wherever it moves</p>\n</li>\n</ul>\n<p>&nbsp;</p>\n</li>\n<li>Allow this sprite’s <strong>pen size</strong> and <strong>pen colour </strong>to be changed whenever this sprite touches the other (bouncing) sprite, according to the following scheme:\n<ul>\n<li>If the user-controlled sprite is on the left half of the screen:\n<ul>\n<li>Change the pen size by 2</li>\n</ul>\n</li>\n<li>If the user-controlled sprite is on the right half of the screen:\n<ul>\n<li>Change the pen colour by 10</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p dir=\"ltr\">&nbsp;</p>\n\n"},{"id":"g0c3d2c9fc83798f3424d2eec9f96f4da","kind":"assignment","title":"Make an Interactive Short Story","nav_title":"Make an Interactive Short Story","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 5.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3,zip</span></div><p>To experiment with <i>creating your own events</i> <i>with broadcasts and taking user inpu</i><i>t</i>, create an interactive short story or play. Create characters, experiment with moving sprites around the stage – it’s up to you!</p>\n<p><strong><img src=\"media/web_resources/Uploaded-Media/Interactive-A2-01.PNG\" alt=\"Interactive A2 - 01.PNG\" width=\"708\" height=\"252\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/242887403\" data-api-returntype=\"File\" loading=\"lazy\"><br></strong></p>\n<p><strong>Base Features<br></strong></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Within your story, you must include the following components:</p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">At least one Backdrop</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">At least two characters</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">At least<strong> five broadcast statements</strong></p>\n</li>\n</ul>\n<p><span style=\"color: var(--ic-brand-font-color-dark); font-family: inherit; font-size: 1rem;\">Broadcasts must be named appropriately (“bear appears” rather than “message1\")<br><br></span></p>\n</li>\n<li dir=\"ltr\">\n<p><span style=\"color: var(--ic-brand-font-color-dark); font-family: inherit; font-size: 1rem;\">Ask the user at least one question (using the ask block)</span></p>\n</li>\n</ol>\n<div class=\"editor-indent\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>The <strong>answer to this question </strong>should be used in an IF or IF/ELSE statement so that the user’s response impacts what happens in the story.</li>\n</ul>\n</li>\n</ul>\n</div>\n<p><img src=\"media/web_resources/Uploaded-Media/Interactive-A2-02.PNG\" alt=\"Interactive A2 - 02.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/242887786\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><strong>Challenge Features</strong></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Incorporate a second user-input question that is used in a condition</p>\n</li>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Using the <strong>ask </strong>block for user-input</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Using the answer block inside an <strong>IF</strong> or<strong> IF/ELSE </strong>blocks<br><br></p>\n</li>\n</ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Include some image or costume effects that are applied depending on the user’s input</p>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p><strong>Outcomes</strong></p>\n<p>CP1, FP3</p>\n\n"}]},{"id":"g723b07093524102ff34fc22935e12d83","slug":"05-scratch-02-decision-making-and-repetition","title":"Scratch 02: Decision-Making and Repetition","order":5,"items":[{"id":"g3be3ffe98293ec6a0dd7631ca8f82e5a","kind":"page","title":"Videos: Extracting Costumes from Spritesheets","nav_title":"Videos: Extracting Costumes from Spritesheets","position":5,"published":true,"content_html":"<p><span style=\"font-size: 14pt;\"><strong>How to Rip images from a Spritesheet</strong></span></p>\n<p>Using Photopea (free, web-based):&nbsp; &nbsp;</p>\n<div>\n<div><iframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/YuIzYZ9UbJ0\" width=\"560\" height=\"315\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" data-mce-fragment=\"1\"></iframe>\n<div>\n<p dir=\"ltr\">&nbsp;</p>\n</div>\n</div>\n</div>\n<p>Using Photoshop (if you have access to it):&nbsp; &nbsp; &nbsp;</p>\n<div>\n<div>\n<div id=\"id_videojs_626979d16e897_2\" title=\"watch\" role=\"region\" aria-label=\"Video Player\" data-setup-lazy=\"{&quot;techOrder&quot;: [&quot;youtube&quot;], &quot;sources&quot;: [{&quot;type&quot;: &quot;video/youtube&quot;, &quot;src&quot;:&quot;https://www.youtube.com/watch?v=Sbtq5qoeJFQ&quot;}], &quot;language&quot;: &quot;en&quot;, &quot;fluid&quot;: true}\">\n<div><iframe id=\"id_videojs_626979d16e897_2_youtube_api\" title=\"YouTube video player\" src=\"https://www.youtube.com/embed/Sbtq5qoeJFQ?controls=0&amp;modestbranding=1&amp;rel=0&amp;showinfo=0&amp;loop=0&amp;fs=0&amp;hl=en&amp;enablejsapi=1&amp;origin=https%3A%2F%2Fmoodle4u.portagecollege.ca&amp;widgetid=2\" width=\"640\" height=\"360\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" data-mce-fragment=\"1\"></iframe></div>\n</div>\n</div>\n</div>\n<p>&nbsp;</p>\n\n"},{"id":"gd39c96eae99363712eb6fcd1400a8d6b","kind":"quiz","title":"Scratch Quiz Two: Basics, Decisions, and Loops","nav_title":"Scratch Quiz Two: Basics, Decisions, and Loops","position":8,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 8.0</span></div><p>A quiz to check our understanding on coordinate systems, broadcast, conditions, and loops.&nbsp;</p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of 480 and a stage height of 360, what is the current </span><strong>y-position</strong><span> of Scratch?</span></p>\n<p><span><img src=\"media/web_resources/W01-Q-07.JPG\" alt=\"\" loading=\"lazy\"></span></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 90</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of 480 and a stage height of 360, what is the current </span><strong>x-position</strong><span> of Scratch?</span></p>\n<p><img src=\"media/web_resources/W01-Q-06.JPG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 480</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n</ul>\n</div>\n</div>"}]},{"id":"g006dd7d12c54c4c6bb158178d01ffe26","slug":"06-scratch-03-variables","title":"Scratch 03: Variables","order":6,"items":[{"id":"g2aeb170361fa163c3ccbf285f5b78c6f","kind":"weblink","title":"Exercise: Programmable Robot","nav_title":"Exercise: Programmable Robot","position":1,"published":true,"external_url":"https://docs.google.com/presentation/d/e/2PACX-1vS40EeeXwmWbXSFXJATfFJK9uktAz1YD2m398sT4bWj-h8cvc747KpCeo9t9fBvG57PhMV4u1estFLr/pub?start=false&loop=false&delayms=3000&slide=id.p"},{"id":"gd1a181af0e221341b0aa483f05733908","kind":"assignment","title":"Math Grapher","nav_title":"Math Grapher","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p><span style=\"font-size: 18pt;\"><strong>Slope of a Line:</strong></span></p>\n<p>The slope of a line tells us whether it is rising or falling, as well as how steep it is.<br><img src=\"media/web_resources/Uploaded-Media/Scratch-A01-I06.jpg\" alt=\"Scratch - A01 - I06.jpg\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245750092\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em>To complete this project, you’ll need to be able to calculate the slope of a line. Hopefully, this is a familiar operation, but if you’d like a refresher please check out the following video:</em></p>\n<p><iframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/WkspBxrzuZo?si=g4hvjnL0KnfQWpUc\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" loading=\"lazy\"></iframe></p>\n<p><br><br><br><span style=\"font-size: 18pt;\"><strong>Adding the Pen Extension:</strong></span><strong></strong></p>\n<p>For this project, you’ll need to add the pen extension as you did earlier.<br><br><img src=\"media/web_resources/Uploaded-Media/Scratch-A-Extensions.png\" alt=\"Scratch - A - Extensions.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245750145\" data-api-returntype=\"File\" loading=\"lazy\"><br><span><em>To add an extension, first, find the “add extension” button in the bottom left corner.</em></span></p>\n<p><span><em><br><img src=\"media/web_resources/Uploaded-Media/Scratch-A1-Pen-Extension.png\" alt=\"Scratch - A1 - Pen Extension.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245750206\" data-api-returntype=\"File\" loading=\"lazy\"><br>Then choose the extension called “pen”.</em></span><em></em></p>\n<p><br><br><br><span style=\"font-size: 18pt;\"><strong>Base Features Requirements&nbsp;</strong></span></p>\n<ol style=\"list-style-type: decimal;\">\n<li>Create a program that begins by asking the user for <strong>4 inputs</strong>, and stores each in its own <strong>variable:</strong>\n<ul style=\"list-style-type: disc;\">\n<li>A X-value for the first point of a line segment</li>\n<li>A Y-value for the first point of a line segment</li>\n<li>A X-value for the second point of a line segment</li>\n<li>A Y-value for the second point of a line segment<br><br>\n</li>\n</ul>\n</li>\n<li>Once this data has been stored, have a sprite (which can be visible&nbsp;<strong>or</strong> invisible) draw that particular line segment on the screen using the&nbsp;<strong>pen blocks.</strong><br><br>\n</li>\n<li>Given the line drawn,&nbsp;<strong>calculate the slope of this line</strong> and store it in a variable.<br><br>\n</li>\n<li>Have your sprite report what the line's slope is for&nbsp;<strong>2 seconds.</strong>\n<ul style=\"list-style-type: disc;\">\n<li>If you've used the <strong>hide block</strong>, the say block won't show up on the stage!</li>\n<li>At this point, either make sure to&nbsp;<strong>show</strong> the sprite, or use <strong>set ghost effect to 100</strong> instead; this hides the sprite but still allows text to be displayed.<br><br>\n</li>\n</ul>\n</li>\n<li>At this point, the base features are complete!<br><br><br><br>\n</li>\n</ol>\n<p><span style=\"font-size: 18pt;\"><strong>Challenge Features Requirements&nbsp;</strong></span><em> (Parallelogram Area Calculator)<br><br></em>A <strong>Parallelogram </strong>can be created with <span style=\"text-decoration: underline;\">two sets of lines</span> that are <span style=\"text-decoration: underline;\">parallel to each other</span>. Expand the program above to add a horizontal line to both endpoints of the user’s original line segment. Then, add a copy of the original line segment to the end of these horizontal segments to complete a parallelogram. Lastly, report the area of this closed shape. Some additional explanation is below:<em><br></em></p>\n<ol style=\"list-style-type: decimal;\">\n<li><span>Draw Original Line Segment - If you've completed the <strong>base features</strong> then this is already done! See more details up there...<br><br></span></li>\n<li><span>Ask the user for a horizontal distance - store this value in a variable, then use it to draw two horizontal lines attached to each endpoint of the original line segment:<br><img src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I02.PNG\" alt=\"Scratch- WO3 - A02 - I02.PNG\" width=\"447\" height=\"215\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245751296\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></span></li>\n<li><span>Using that value, draw two horizontal lines segments of that length from each of the two existing endpoints (Remember, you should have these (x,y) locations stored in variables already)<br><img src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I03.PNG\" alt=\"Scratch- WO3 - A02 - I03.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245751365\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></span></li>\n<li><span>To finish the parallelogram, draw a line segment with the same length and slope as the first, but starting and ending at the free horizontal endpoints. (Note: the sprite that is enacting these scripts can be visible or hidden while drawing)<br><img src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I04a.PNG\" alt=\"Scratch- WO3 - A02 - I04a.PNG\" width=\"307\" height=\"149\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245752229\" data-api-returntype=\"File\" loading=\"lazy\"> &nbsp;<img src=\"media/web_resources/Uploaded-Media/CSCR-WO3-A02-I04b.PNG\" alt=\"CSCR - WO3 - A02 - I04b.PNG\" width=\"298\" height=\"130\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245752232\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></span></li>\n<li><span>Once the shape has been drawn, calculate what the area of the parallelogram is. If you don’t have the formula memorized (I didn’t!), you may need to do an internet search to find it. It is very readily available. Calculate the area and store it in an appropriately-named variable.<br><br></span></li>\n<li><span>Lastly, have the sprite report what the area is. The sprite will need to be visible at this point in order for its speech bubble to be visible as well.<br><img src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I05.PNG\" alt=\"Scratch - WO3 - A02 - I05.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/245752341\" data-api-returntype=\"File\" loading=\"lazy\"><br></span></li>\n</ol>\n\n"}]},{"id":"g64f83bde275725d4a7f26c354a42fa1e","slug":"07-scratch-04-major-project","title":"Scratch 04: Major Project","order":7,"items":[{"id":"g0f7ae95d99d2bfbcce76603c66eaf4f8","kind":"assignment","title":"Coolest Scratch Assignment","nav_title":"Coolest Scratch Assignment","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 16.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online url,online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3,zip</span></div><p><span><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/Scratch-Major-Project-Examples.png\" alt=\"\" width=\"515\" height=\"385\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/11226751/files/285771568\" data-api-returntype=\"File\" loading=\"lazy\"></span></p>\n<p>&nbsp;</p>\n<p><span>This is an open-ended assignment, where you will show some evidence of your learning in the class so far. There are just a couple of stipulations:</span><span><br><br></span></p>\n<p><span style=\"font-size: 14pt;\"><strong>Open-Ended Topic</strong></span><span><br></span><span><br></span><span>For this project, you should create the coolest, most interesting thing you can in Scratch with what you’ve learned so far. This could be a game, an interactive program, or some sort of productivity software (a program that helps complete a task). Be sure to choose something that you’ll find interesting to work on for a full week!</span><span><br><br></span></p>\n<p><span style=\"font-size: 14pt;\"><strong>Included Concepts</strong></span><span><br></span><span><br></span><span>This project is an opportunity to showcase all the concepts you’ve gained experience with over the past few weeks, and you must be sure to include all of the following </span><i><span>in some useful form</span></i><span>:</span><span><br><br></span></p>\n<ul style=\"list-style-type: disc;\">\n<li><span>Broadcasts</span></li>\n<li>Loops (must include both a <strong>condition</strong> and <strong>counting</strong> loop)</li>\n<li>Conditionals ( IF / ELSE )</li>\n<li>Variables</li>\n<li>A Function without inputs</li>\n<li>A Function with at least one input</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong><span style=\"font-size: 14pt;\">Complexity</span></strong><span><br></span><span><br></span><span>As you're being given a full week to work on this project, its complexity should represent a 5-6 hours of dedicated work! Part of the grading rubric for the project will be that it’s complexity represents that amount of time commitment.</span><span><br></span></p>\n<p>In this project, you should aim to <i>develop your skills </i>by exploring further an idea touched on in class (ie working with lists, clones), or something we didn't address at all. By the end of the project you should be able to describe something new you were able to accomplish in your program.</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Documentation</strong></span><br><br>All programs should be accompanied by some form of documentation, which explains to users what the purpose of the software is as well as how to interact correctly with it. For this project, you'll need to submit a&nbsp;<strong>minimum 1-page</strong> documentation/reflection. Specific requirements can be seen in the module item <a title=\"Scratch Project Documentation\" href=\"#item:g6c73fc015a3d4a433bd0d4aa5a4e89a3\" data-course-type=\"assignments\" data-published=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/11226751/assignments/52831719\" data-api-returntype=\"Assignment\" data-item-ref=\"g6c73fc015a3d4a433bd0d4aa5a4e89a3\">\"Scratch Project Documentation\"</a>. This is submitted separately from the Major Project, but comprises 20% of the overall project grade.<span><br></span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Your Ideas, Your Code</strong></span><span><br></span><span><br></span><span>Choose a topic/premise that you'll enjoy working on for several days, and I hope you'll have fun with this project! A few things:<br><br></span></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>\n<span>This project should be of your own design. (Don't follow along with a tutorial or remix someone else's work)</span>\n<ul>\n<li><span>However, the premise can be something you've seen elsewhere. <em>(For instance, planning to recreate the game \"Battleship\" is fine, as long as your version is made by you from scratch).<br><br></em></span></li>\n</ul>\n</li>\n<li>\n<span>You are welcome to look at others projects on the Scratch website to get ideas and study how they have made their projects, but you shouldn't have your program open at the same time.&nbsp; </span>\n<ul>\n<li><span>As well, If you take a specific idea from another project, video resource, or similar, you must attribute/cite it appropriately in your documentation.&nbsp;</span></li>\n<li><span><strong>Failing to do so is plagiarism</strong>, so please ensure to take care of this step if needed.</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>Outcomes</strong></p>\n<p>CP1, CP2, FP1, FP2, FP3</p>\n\n"},{"id":"g6c73fc015a3d4a433bd0d4aa5a4e89a3","kind":"assignment","title":"Scratch Project Documentation","nav_title":"Scratch Project Documentation","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 4.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> txt,rtf,doc,docx</span></div><p><span>Good documentation is an important component of any computer program; it informs users how to use your software, and makes it possible for other programmers – who might be taking over a project – to understand how it works!</span></p>\n<p><span>For our class, you can use the following structure when documenting your code:</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\">Basic Instructions and Explanation</span></p>\n<p><span>In a text document (word, pdf, txt), address the following topics. Be thorough – you should not assume that the user has any background knowledge of your program; your documentation should allow a beginner to successfully understand and operate your software. </span><i><span>As a reference point, this should not be shorter than a page (single spaced), and will be graded according to whether this amount of length was met, and that all five sections below were reflected on appropriately. (250 words +)<br><br></span></i></p>\n<ol>\n<li>\n<span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><strong>Basic Premise</strong>\n</li>\n</ol>\n<p><span>Explain what the program is. If it is for productivity, describe how the program will assist the user with a task. If it is a game, describe the type of game and any relevant backstory.<br><br></span></p>\n<ol start=\"2\">\n<li>\n<span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><strong>Key Features</strong>\n</li>\n</ol>\n<p><span>A summary of the different features or capabilities of the program. If applicable, provide a breakdown description of each feature. Explain what the user needs to do to in order to make the program work correctly.<br><br></span></p>\n<ol start=\"3\">\n<li>\n<span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><strong>Controls / Game Mechanics</strong>\n</li>\n</ol>\n<p><span>Provide a listing of the different user input controls. If a user forgets what buttons they need to press on the keyboard or what to click, they should be able to look it up.<br><br></span></p>\n<ol start=\"4\">\n<li>\n<span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><strong>Limitations</strong>\n</li>\n</ol>\n<p><span>If there are known bugs or issues with the program (ways that the user can break the program) that you have been unable to fix, list the problems and potential workarounds.<br><br></span></p>\n<ol start=\"5\">\n<li>\n<strong> &nbsp;&nbsp;</strong> <strong>Personal Comments</strong>\n</li>\n</ol>\n<p><span>As the author of the program, add a short reflection on the program.&nbsp;</span></p>\n<ul>\n<li><span>What new ideas or challenging aspects of the program did you tackle?</span></li>\n<li><span>If you had more time, how would you extend this program?</span></li>\n<li><span>Add any other reflections you have on your project.</span></li>\n</ul>\n\n"}]},{"id":"g9b4565ce52bedf85e330f0f523a733ec","slug":"08-reeborg-constrained-language","title":"Reeborg: Constrained Language","order":8,"items":[{"id":"gbbe1e448745c6c8ec1d75c6d14ceacdd","kind":"weblink","title":"Reeborg Environment","nav_title":"Reeborg Environment","position":1,"published":true,"external_url":"https://reeborg.cs20.ca/?lang=en&mode=python&menu=worlds%2Fmenus%2Fsk_menu.json&name=Step%200&url=worlds%2Fsk%2Fstep0.json"},{"id":"gf23e9b8ee0d89c26824e11df972a3512","kind":"weblink","title":"CS20 - Open Textbook","nav_title":"CS20 - Open Textbook","position":2,"published":true,"external_url":"http://cs20.ca"}]},{"id":"g7991e6cc180e421e9c49ee105c184152","slug":"09-python-presentations","title":"Python Presentations","order":9,"items":[{"id":"g2a1781e965396e2348fb4b6096e527ab","kind":"file","title":"01 Python - Input, Output, Data Types.pptx","nav_title":"01 Python - Input, Output, Data Types.pptx","position":1,"published":true,"media_path":"media/web_resources/01-Python-Input-Output-Data-Types.pptx"}]},{"id":"g59fdbea598c0a283e4513961ba1c095b","slug":"10-python-basics","title":"Python - Basics","order":10,"items":[{"id":"g8d6cb5557333cf3a3c92600f690ccd24","kind":"assignment","title":"Temperature Conversion","nav_title":"Temperature Conversion","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> py</span></div><p><img src=\"media/web_resources/degrees.png\" alt=\"degrees.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/8596367/files/241852347\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>Write a Python program that will convert between degrees Celsius to degrees Fahrenheit.</p>\n<p><strong>Base Requirements:</strong></p>\n<p><span style=\"text-decoration: underline;\">Part One:</span></p>\n<p style=\"padding-left: 30px;\">Write a function called&nbsp;<strong>c_to_f(),&nbsp;</strong>which will do the following:</p>\n<p style=\"padding-left: 60px;\">- Ask the user to input a temperature in Celsius</p>\n<p style=\"padding-left: 60px;\">- Convert that value to Fahrenheit, and store that value in a variable</p>\n<p style=\"padding-left: 60px;\">- Print a message to the console saying what the converted temperature's value is.</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Part Two:</span></p>\n<p style=\"padding-left: 30px;\">Write a similar function, called f<strong>_to_c(),&nbsp;</strong>which will do the following:</p>\n<p style=\"padding-left: 60px;\">- Ask the user to input a temperature in&nbsp;Fahrenheit</p>\n<p style=\"padding-left: 60px;\">- Convert that value to Celsius, and store that value in a variable</p>\n<p style=\"padding-left: 60px;\">- Print a message to the console saying what the converted temperature's value is.<br><br></p>\n<p><span style=\"text-decoration: underline;\">Part Three:</span></p>\n<p style=\"padding-left: 30px;\">Have your program begin by letting the user choose which type of conversion they would like to run:&nbsp; <strong>f_to_c()</strong> or<strong> c_to_f()</strong>&nbsp;.</p>\n<p style=\"padding-left: 60px;\">- You may ask them to indicate their choice by entering a String or a numeric value.</p>\n<p style=\"padding-left: 30px;\"><br>Call the appropriate function based on the user's selection.</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Style:</span></p>\n<p>Your program must include both a comment header as well as inline comments, as described below.</p>\n<p>&nbsp;</p>\n<p><strong>Sample Output:</strong><span>&nbsp;</span></p>\n<p><em>Reference the following sample output to double-check that your program yields the correct conversions:</em></p>\n<p>Type 'C' for Celsius to Fahrenheit or 'F' for the reverse: <span style=\"color: #339966;\">C</span><br>Enter a temperature in&nbsp;Celcius: <span style=\"color: #339966;\">46</span><br>That is <span style=\"color: #339966;\">114.8</span> degrees Fahrenheit</p>\n<p><span><br>Type 'C' for Celsius to Fahrenheit or 'F' for the reverse</span><span>:&nbsp;</span><span style=\"color: #339966;\">C</span><br><span>Enter a temperature in</span><span>&nbsp;Celcius</span><span>:&nbsp;</span><span style=\"color: #339966;\">0</span><br><span>That is&nbsp;<span style=\"color: #339966;\">32.0</span> degrees Fahrenheit</span></p>\n<p><span><br></span><span>Type 'C' for Celsius to Fahrenheit or 'F' for the reverse</span><span>:&nbsp;</span><span style=\"color: #339966;\">F</span><br><span>Enter a temperature in</span><span>&nbsp;Fahrenheit</span><span>:&nbsp;</span><span style=\"color: #339966;\">35.6</span><br><span>That is <span style=\"color: #339966;\">2.0</span>&nbsp;degrees&nbsp;Celsius</span></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>Additional Tips:</strong>&nbsp;</p>\n<p>As this is the first Python assignment you are going to submit, the following notes might be useful:</p>\n<p>- be sure to include a comment header in your code, which means your Python file should start with something like&nbsp;</p>\n<pre>#######################################################<br># Stefan Scott<br># Computer Science 20<br># October 23, 2017<br># <br># Temperature Conversion Program<br># Purpose: To convert a temperature from degrees to Fahrenheit.<br>#######################################################<br><br></pre>\n<p>- make sure you save your file as a .py file. That is the only type of file you'll be able to upload for this assignment.</p>\n<p>- use <em>input()</em> to allow the user to type in the temperature that should be converted [remember that&nbsp;<em>input()</em> will always return string-type data]</p>\n<p>&nbsp;</p>\n<p><strong>Challenge Features</strong></p>\n<p>&nbsp;</p>\n<ul>\n<li>try to foolproof the input (in other words, make sure your program doesn't crash if I type in \"frank\" instead of 15).&nbsp;<em>Hint: Check out the<a href=\"https://docs.python.org/3/tutorial/errors.html\"> <strong>try</strong> and <strong>except</strong></a> keywords (read 8.3).&nbsp;</em>\n</li>\n<li>add the ability to convert to/from Kelvin as well (in one direction only - to either Celsius or Fahrenheit, <em>whichever you choose</em>)</li>\n</ul>\n\n"},{"id":"g0e24de8e88ffe4c47a0b9a3e1fe30911","kind":"file","title":"12 Basic Lists.pptx","nav_title":"12 Basic Lists.pptx","position":6,"published":true,"media_path":"media/web_resources/12-Basic-Lists.pptx"},{"id":"g3b8239c67b31c7fced3ee41594dd9ebe","kind":"assignment","title":"Madlib","nav_title":"Madlib","position":7,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> py,txt,zip</span></div><p>To practice input/output in Python, you will make<strong> two Mad Libs</strong>.&nbsp;</p>\n<p>At the start of the program, you should ask the user which MadLib they want. Once the user has selected a MadLib, your program should take in input from the user, then use that input when outputting a story or poem.</p>\n<p>If you are not familiar with madlibs, you may want to investigate what they are by searching the web for a “madlibs website”. In essence, you want to take a familiar story and make it funny by randomly placing your users words into the story.&nbsp;Feel free to use any old school rhyme, or something of your own creation. Though it can be difficult with user input, try to make sure your story makes sense.</p>\n<p>&nbsp;</p>\n<div class=\"highlight-none\">\n<div class=\"highlight\">\n<pre>Humpty Dumpty sat on a wall,\nHumpty Dumpty had a great fall.\nAll the king's horses and all the king's men\nCouldn't put Humpty together again.\n</pre>\n</div>\n</div>\n<p>In your program, you could take user input:</p>\n<div class=\"highlight-none\">\n<div class=\"highlight\">\n<pre>Person's First Name: Bree\nPerson's Last Name: Janzen\nVerb (past tense action): ran\nJob Title (such as principal, electrician, etc.): plumber\nAnimal (plural): dogs\n</pre>\n</div>\n</div>\n<p>After processing the user input, your program could print out:</p>\n<div class=\"highlight-none\">\n<div class=\"highlight\">\n<pre>Bree Janzen ran on a wall,\nBree Janzen had a great fall.\nAll the plumber's dogs and all the plumber's men\nCouldn't put Bree together again.\n</pre>\n</div>\n</div>\n<p>Both of your madlibs should take in at least 5 words from the user, but no more than 10. Feel free to use any old school rhyme, or something of your own creation. Though it can be difficult with user input, try to make sure your story makes sense.</p>\n<p>Remember to use a comment header at the top of your program!</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Base Requirements</strong></span></p>\n<ol>\n<li>Your program must include&nbsp;<strong>Two different madlibs.</strong> Begin the program by asking the user which madlib they would like to try (option 1 or 2).\n<ul>\n<li>Before starting the second madlib, read the expert challenge requirements below, as the second madlib will be slightly different if you choose to tackle that challenge.</li>\n</ul>\n</li>\n<li>Each madlib should ask the user for at least 5 input words (entered by the user), but no more than 10.</li>\n<li>Comment Header at the top of the program is required, as well as some inline comments to describe the different sections to the program.<br><em>HINT: we've looked at&nbsp;<span style=\"text-decoration: underline;\">formatted (f)</span></em><span style=\"text-decoration: underline;\"> strings</span>; using these may make for simple handling of multi-line text and substitutions of the user's word selections.<br><br>\n</li>\n</ol>\n<p><span style=\"font-size: 18pt;\"><strong>Challenge Features</strong></span></p>\n<ul class=\"simple\">\n<li>For the second madlib, instead of letting the user enter words when running the program, have your program choose the input words&nbsp;<strong>randomly.</strong> There are two options for how to do this, one easier and one a bit harder:&nbsp;<br><em><strong>NOTE:</strong> each option has a different max mark for this section</em>\n</li>\n</ul>\n<p><span style=\"text-decoration: underline;\">Lists of Words</span> <em>[this option worth 0.5/1]</em></p>\n<p style=\"padding-left: 40px;\">Create a list of possible words, and have Python choose one of these words<span>&nbsp;</span><a class=\"reference external\" href=\"http://stackoverflow.com/questions/306400/how-do-i-randomly-select-an-item-from-a-list-using-python\">at random</a>.</p>\n<p><br><span style=\"text-decoration: underline;\">Read words from External Files</span> <em>[this option worth 1/1]</em></p>\n<p style=\"padding-left: 40px;\">Create text files for each of the parts of speech that you will require (ie. nouns.txt, adjectives.txt, etc) and have the computer randomly choose one of the words from the appropriate text file to complete the madlib.</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul class=\"simple\">\n<li>In our class demo, we look at reading data from a file and storing each line as an item in a list. If you were present for this demo I'd suggest following a similar approach where each work is stored on its own line in the text file.<br><br>\n</li>\n<li>Another option, however, would be to store all the words on a single line, separated by a single character (either a space, or a semicolon)<br><br>excited angry uncertain crazy&nbsp; &nbsp; &nbsp; &nbsp; OR&nbsp; &nbsp; &nbsp; &nbsp;excited;angry;uncertain;crazy<br><br>\n</li>\n<li>Then you have two tasks:\n<ul class=\"simple\">\n<li>to read that line from a file and store it in a variable as a string. <a href=\"https://www.w3schools.com/python/python_file_open.asp\">(see here for reading one line)</a>\n</li>\n<li>to create a list from that string that contains all the individual words <a href=\"https://www.w3schools.com/python/ref_string_split.asp\">(see here for splitting a string)</a>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n\n"}]},{"id":"g5d0021aae0b53857ceb809b93d9957cf","slug":"11-python-turtle-and-micro-bit","title":"Python - Turtle and Micro:bit","order":11,"items":[{"id":"g32012ea94cbab7b028c810a77873d2c7","kind":"weblink","title":"Reference: Turtle Methods","nav_title":"Reference: Turtle Methods","position":1,"published":true,"external_url":"https://docs.python.org/3/library/turtle.html#overview-of-available-turtle-and-screen-methods"},{"id":"g3c0db37c3713d3169e11705f5d92d9ea","kind":"weblink","title":"HTML color names","nav_title":"HTML color names","position":2,"published":true,"external_url":"https://www.w3schools.com/colors/colors_names.asp"},{"id":"g984adf2a252b462ad6d948e342017d25","kind":"assignment","title":"Turtle Confusion 1","nav_title":"Turtle Confusion 1","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> py</span></div><p>For this turtle graphics challenge, create a program that creates uses the <strong>turtle library</strong> to draw all of the following shapes on <span style=\"color: #993300;\"><strong>in a single window</strong></span>.</p>\n<p><img src=\"media/web_resources/turtle-confusion-1.JPG\" alt=\"Completed Turtle 1\" width=\"541\" height=\"198\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/13988997/files/330651087\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p style=\"padding-left: 30px;\">&nbsp;<span style=\"color: #808080;\">You may want create a window that is bigger than the default one. To do this, you can use the .setup() function:</span></p>\n<p style=\"padding-left: 60px;\">wn = turtle.Screen()<br>wn.setup(800,400)&nbsp; &nbsp;<span style=\"color: #008000;\"> #makes the window 800 pixels wide and 400 pixels high</span></p>\n<p><em>Don't forget your header, inline comments, and to make sure you are using functions and loops to make your code elegant and efficient.</em></p>\n<p><img src=\"media/web_resources/confusion-19.png\" alt=\"confusion-19.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/13988997/files/330651081\" data-api-returntype=\"File\" loading=\"lazy\"><img src=\"media/web_resources/confusion-20.png\" alt=\"confusion-20.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/13988997/files/330651091\" data-api-returntype=\"File\" loading=\"lazy\"><img src=\"media/web_resources/confusion-21.png\" alt=\"confusion-21.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/13988997/files/330650951\" data-api-returntype=\"File\" loading=\"lazy\"><img src=\"media/web_resources/confusion-22.png\" alt=\"confusion-22.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/13988997/files/330651089\" data-api-returntype=\"File\" loading=\"lazy\"><img src=\"media/web_resources/confusion-23.png\" alt=\"confusion-23.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/13988997/files/330651263\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>Extra for Experts:</p>\n<p>Also include the following, more challenging image:</p>\n<p><img src=\"media/web_resources/confusion-35.png\" alt=\"confusion-35.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/13988997/files/330650927\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>Need Even More Challenges? Just to Challenge your brain:</p>\n<p><img src=\"media/web_resources/confusion-28.png\" alt=\"confusion-28.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/13988997/files/330650913\" data-api-returntype=\"File\" loading=\"lazy\"><img src=\"media/web_resources/confusion-31.png\" alt=\"confusion-31.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/13988997/files/330651085\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<details>\n<summary><span style=\"font-size: 14pt;\"><span style=\"color: #ecf0f1; background-color: #ba372a;\"><strong>HINT:</strong></span>&nbsp;</span> If needed, click here to see some&nbsp;<em>general advice</em> for how to approach this problem...</summary>\n<div style=\"padding-left: 40px;\"><span style=\"font-size: 14pt;\"><strong><br>Planning:</strong></span></div>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul style=\"list-style-type: square;\">\n<li>Identify Simple Shape</li>\n<li>Identify Pivot (common point for all simple shapes)<br><br></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<div style=\"padding-left: 40px;\"><strong><span style=\"font-size: 14pt;\">Coding:</span></strong></div>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li><span>Move turtle to where you want to draw the shape</span></li>\n<li>Write a function to draw simple shape only\n<ul>\n<li>start/end at same spot</li>\n<li>start/end facing same direction</li>\n</ul>\n</li>\n<li>Use a loop to draw simple shape ___ times\n<ul>\n<li>rotate turtle ___ degrees after each shape</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</details>\n\n"}]}],"unfiled":[]}</script>
