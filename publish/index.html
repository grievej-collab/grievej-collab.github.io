<script id="site-data" type="application/json">{"site_title":"CS20 2026-27","modules":[{"id":"g91845993c5064874e3d78a3e156b6e75","slug":"01-welcome-and-introduction","title":"Welcome and Introduction","order":1,"items":[{"id":"g5f129f042e77a95aba22c080552499b5","kind":"file","title":"Computer Science 20 Course Outline.docx","nav_title":"Computer Science 20 Course Outline.docx","position":1,"published":true,"media_path":"media/web_resources/Computer-Science-20-Course-Outline.docx"},{"id":"g2e695c84068c3343bb5f97deb6b3b6ed","kind":"file","title":"Room 135 Lab Expectations.docx","nav_title":"Room 135 Lab Expectations.docx","position":2,"published":true,"media_path":"media/web_resources/Room-135-Lab-Expectations.docx"},{"id":"g63b6350ac749ba6158b2c3bce8c93046","kind":"page","title":"\"About You\" Form","nav_title":"\"About You\" Form","position":3,"published":true,"content_html":"<p><iframe src=\"https://docs.google.com/forms/d/e/1FAIpQLSegaIl3focUOhDIU2Z-i2d3DQUKVy0K6PmfbZacE_JIu9_ziQ/viewform?embedded=true\" width=\"840\" height=\"962\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"g382d8461d7e0bd6464fedabca067cbf5","kind":"weblink","title":"Sign up for Scratch!","nav_title":"Sign up for Scratch!","position":4,"published":true,"external_url":"https://scratch.mit.edu/signup/3jywhjmxn"}]},{"id":"gecb79ca1d84195a6ddda061e450b7282","slug":"03-scratch-presentations","title":"Scratch Presentations","order":3,"items":[{"id":"gefa27eaddf6ed7d7cf647fe640f49387","kind":"page","title":"Scratch Environment and Problem Solving","nav_title":"Scratch Environment and Problem Solving","position":1,"published":true,"content_html":"<iframe src=\"https://docs.google.com/presentation/d/1h1kareIz2HPio5z1AHoqVAen3pp8zlx0Q4YoVPjZuzk/embed?start=false&amp;loop=false&amp;delayms=3000\" frameborder=\"0\" width=\"960\" height=\"569\" allowfullscreen=\"true\" mozallowfullscreen=\"true\" webkitallowfullscreen=\"true\" loading=\"lazy\"></iframe>\n\n"},{"id":"g39fd0f60318d47dc8b7ab33bb31551df","kind":"page","title":"New Page","nav_title":"Test Upload","published":true,"content_html":"Sept 1&nbsp;<p></p><p>https://scratch.mit.edu/projects/editor/?tutorial=getStarted</p>"}]},{"id":"gdcd327faba249ba761dbab487cb3232c","slug":"04-scratch-01-visual-programming-and-problem-solving","title":"Scratch 01:  Visual Programming and Problem-Solving","order":4,"items":[{"id":"g19b772f0930e01ce379854a4d39d0b98","kind":"file","title":"Scratch Environment and Problem Solving.pptx","nav_title":"Scratch Environment and Problem Solving.pptx","position":1,"published":true,"media_path":"media/web_resources/Scratch-Environment-and-Problem-Solving.pptx"},{"id":"g71961a6a70278d18dc49a324d707a36d","kind":"assignment","title":"Scratch Artist","nav_title":"Scratch Artist","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p dir=\"ltr\"><img src=\"media/web_resources/Uploaded-Media/artist.PNG\" alt=\"artist.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/268938327\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p dir=\"ltr\">This will add all of the pen blocks that you’ll need for this project.</p>\n<p><br><br></p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Base Feature Requirements</strong></span></p>\n<p>&nbsp;</p>\n<p dir=\"ltr\"><i>Completing the following basic features will allow for a maximum grade of 9/10. The remaining Challenge Features will account for the remaining 1 mark.</i></p>\n<p>&nbsp;</p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Create a program that features one sprite (choose any that you want). When the green flag is pressed, this sprite should begin at the origin (0,0), and choose a random direction to move automatically<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">As it moves, it should use the pen to draw a trail of its motion.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Whenever an edge of the stage is encountered, the sprite should bounce.</p>\n</li>\n<li dir=\"ltr\">Movement must use the&nbsp;<strong>move</strong><strong> block.</strong>&nbsp; No <span style=\"text-decoration: underline;\">glides</span> or <span style=\"text-decoration: underline;\">goto</span> blocks for this feature.</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<ol start=\"2\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">This project should include both<span>&nbsp;</span><strong>background<span>&nbsp;</span></strong><strong>music<span>&nbsp;</span></strong>as well as<span>&nbsp;</span><strong>sound<span>&nbsp;</span></strong><strong>effects</strong>.<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">When the green flag is pressed, start some background music. This should play continually until the user stops the program.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Have a sound effect play whenever the sprite bounces on the edges of the stage<br>&nbsp; &nbsp; &nbsp; <span style=\"color: #e03e2d;\">HINT:</span>&nbsp; &nbsp;<span style=\"color: #7e8c8d;\">The <img src=\"media/web_resources/Uploaded-Media/Scratch-If-on-edge-bounce.PNG\" alt=\"Scratch - If on edge bounce.PNG\" width=\"127\" height=\"53\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/269192261\" data-api-returntype=\"File\" loading=\"lazy\"> is needed, but you have your program handle the sound effect&nbsp;<strong>first.</strong> This is because the \"bounce\" action spins the character and often they will no longer be touching the edge. Use <img src=\"media/web_resources/Uploaded-Media/Scratch-If-touching-edge.PNG\" alt=\"Scratch - If touching edge.PNG\" width=\"214\" height=\"87\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/10266881/files/269192398\" data-api-returntype=\"File\" loading=\"lazy\"> to help with adding a sound effect each time the sprite runs into the edge of the stage.</span></p>\n</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<ol start=\"3\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">Allow the pen characteristics to be modified by the user as follows:<br><br></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>Z key</strong><span>&nbsp;</span>will decrease the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>X key</strong><span>&nbsp;</span>will increase the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span>&nbsp;</span>C key</strong><span>&nbsp;</span>will change the colour of the pen</p>\n</li>\n<li>The<strong><span>&nbsp;</span>R key</strong><span>&nbsp;</span>will reset the drawing (erase all)</li>\n</ul>\n<br>\n<p>&nbsp;</p>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Challenge Features</strong></span><br><br></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Add a second sprite into the sketch, whose<span>&nbsp;</span><strong>movement will be controlled by the user</strong>.</p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use the four arrow keys ( &nbsp;↑ ← ↓ → ) to control the sprite’s x-position and y-position.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use pen commands to make this sprite draw a line wherever it moves</p>\n</li>\n</ul>\n<p>&nbsp;</p>\n</li>\n<li>Allow this sprite’s <strong>pen size</strong> and <strong>pen colour </strong>to be changed whenever this sprite touches the other (bouncing) sprite, according to the following scheme:\n<ul>\n<li>If the user-controlled sprite is on the left half of the screen:\n<ul>\n<li>Change the pen size by 2</li>\n</ul>\n</li>\n<li>If the user-controlled sprite is on the right half of the screen:\n<ul>\n<li>Change the pen colour by 10</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p>&nbsp;</p>\n<p dir=\"ltr\">&nbsp;</p>\n\n"},{"id":"g950486a827c541cbbff0f8a710f54008","kind":"page","title":"New Page","nav_title":"Demo 1 - Sept 3","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1127337218\">https://scratch.mit.edu/projects/1127337218</a><p></p>"},{"id":"gbdfbae7866fe49cfbe5a1efb67cd34d8","kind":"page","title":"New Page","nav_title":"Demo 2 - Sept 4","published":true,"content_html":"<a href=\"https://scratch.mit.edu/projects/1378135008\">https://scratch.mit.edu/projects/1378135008</a><p></p>"}]}],"unfiled":[]}</script>
